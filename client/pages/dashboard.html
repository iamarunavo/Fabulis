<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Fabulis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="logo">FABULIS</a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
        <span class="nav-toggle-icon"></span>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="explore.html">Explore</a>
        <a href="ai-discovery.html">AI Discovery</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutBtn" class="btn btn-secondary">Logout</a>
      </div>
    </div>
  </nav>

  <section class="dashboard-header">
    <div class="container dashboard-header-inner">
      <div>
        <p class="eyebrow">Dashboard</p>
        <h1 id="welcomeHeading">Welcome back</h1>
      </div>
      <div class="ai-cta-inner">
        <div>
          <p class="eyebrow">AI Discovery</p>
          <h2>Not sure what to watch?</h2>
          <p>Tell Fabulis your mood and let AI find your next favorite.</p>
        </div>
        <a href="ai-discovery.html" class="btn btn-primary">Ask Fabulis</a>
      </div>
    </div>
  </section>

  <section class="dashboard-section">
    <div class="container">
      <div class="section-heading">
        <h2>Your Watchlist</h2>
        <a href="explore.html" class="section-link">Browse more &rarr;</a>
      </div>
      <div id="watchlistGrid" class="media-grid">
        <p class="empty-state">Loading your watchlist...</p>
      </div>
    </div>
  </section>

  <section class="dashboard-section">
    <div class="container">
      <div class="section-heading">
        <h2>Popular Right Now</h2>
        <a href="explore.html" class="section-link">See all &rarr;</a>
      </div>
      <div id="popularGrid" class="media-grid">
        <p class="empty-state">Loading recommendations...</p>
      </div>
    </div>
  </section>

  <script src="../js/nav.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/media-card.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
